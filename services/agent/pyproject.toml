[project]
name = "agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prabin K.C.", email = "kcprabin2063@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.142.2",
    "kafka-python>=3.0.11",
    "langchain>=1.4.3",
    "langchain-core",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.2.0",
    "langsmith>=0.14.4",
    "numpy>=2.5.4",
    "pinecone>=10.2.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.4",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
